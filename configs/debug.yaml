dataset:
  name: calms21
  root: data/raw/calms21

video:
  window_seconds: 2.0
  stride_seconds: 2.0
  num_frames: 16

encoder:
  type: videomae
  model_name: MCG-NJU/videomae-base
  batch_size: 2
  device: auto

retrieval:
  method: prototype
  num_examples: 2

postprocessing:
  nms_iou_threshold: 0.5

evaluation:
  match_iou_thresholds:
    - 0.5

experiment:
  seed: 0
